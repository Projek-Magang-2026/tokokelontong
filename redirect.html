<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0D241A">
    <title>Menghubungkan... - Warung Berkah</title>
    <link rel="stylesheet" href="style.css">
    <meta http-equiv="refresh" content="2; url=$(link-redirect)">
    <script>
        function doRedirect() {
            setTimeout(function() {
                const isLocal = window.location.hostname === 'localhost' || 
                                window.location.hostname === '127.0.0.1' || 
                                window.location.protocol === 'file:';
                if (isLocal) {
                    window.location.href = "status.html";
                } else {
                    window.location.href = "$(link-redirect)";
                }
            }, 1200);
        }
    </script>
</head>
<body onload="doRedirect()">

<div class="app-container">
    <header class="hero-banner" style="height: 180px;">
        <div class="hero-overlay"></div>
        
        <div class="hero-top-row">
            <div class="glass-pill">
                <span class="live-dot"></span>
                Memproses Sambungan
            </div>
            <div class="glass-pill weather-pill">
                ⚡ Otomatis
            </div>
        </div>

        <div class="hero-bottom-text">
            <div class="hero-subtitle">MENGHUBUNGKAN KE INTERNET</div>
            <h1 class="hero-title" style="font-size: 19px;">Warung Berkah WiFi</h1>
        </div>
    </header>

    <main class="app-body" style="padding: 30px 18px; align-items: center; justify-content: center; text-align: center;">
        <h2 style="font-size: 16px; font-weight: 800; color: var(--text-main); margin-bottom: 4px;">Memverifikasi Akun WiFi</h2>
        <p style="font-size: 12px; color: var(--text-muted);">Mohon tunggu sebentar, Anda sedang dialihkan...</p>
        
        <div class="loading-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <p style="font-size: 12px; color: var(--text-dim); margin-top: 10px;">
            Jika tidak dialihkan otomatis, <a href="status.html" style="color: var(--primary); font-weight: 700; text-decoration: underline;">klik di sini</a>.
        </p>

        <footer class="app-footer" style="margin-top: 24px;">
            <p><strong>Warung Berkah Kelontong</strong></p>
        </footer>
    </main>
</div>

</body>
</html>
