<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0D241A">
    <title>Kendala Jaringan - Warung Berkah</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">
    <header class="hero-banner" style="height: 180px;">
        <div class="hero-overlay"></div>
        
        <div class="hero-top-row">
            <div class="glass-pill" style="background: rgba(220, 38, 38, 0.4); border-color: rgba(220, 38, 38, 0.5);">
                ⚠️ Terjadi Kendala
            </div>
            <div class="glass-pill weather-pill">
                🏪 Buka 24 Jam
            </div>
        </div>

        <div class="hero-bottom-text">
            <div class="hero-subtitle">INFORMASI JARINGAN</div>
            <h1 class="hero-title" style="font-size: 19px;">Kendala Sambungan</h1>
        </div>
    </header>

    <main class="app-body">
        <div class="error-banner" style="margin-top: 8px;">
            <span>❌</span>
            <div>
                <strong>Informasi Kendala:</strong><br>
                <span>$(error-message)</span>
            </div>
        </div>

        <a href="login.html" class="btn-primary-action" style="margin-top: 10px;">
            <span>Coba Lagi ke Login</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
        </a>

        <div class="quick-grid" style="margin-top: 4px;">
            <a href="https://wa.me/6281234567890?text=Halo%20Kasir%20Warung%20Berkah,%20ada%20kendala%20saat%20login%20WiFi" target="_blank" class="quick-pill-btn" style="grid-column: 1 / -1;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                </svg>
                Bantuan Kasir WhatsApp
            </a>
        </div>

        <footer class="app-footer">
            <p><strong>Warung Berkah Kelontong</strong> • Hubungi kasir jika kendala berlanjut</p>
        </footer>
    </main>
</div>

</body>
</html>
